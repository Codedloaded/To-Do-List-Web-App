<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    
    <h1 class="todo-title">Welcome to the To-Do List</h1>

    <div class="container">

        <div class="todo-container">

            <div class="input-group mb-4">

                <input type="text" id="taskInput" class="form-control" placeholder="Enter a task...">

                <button class="btn btn-primary" id="addTask">Add</button>
            </div>
            <ul id="taskList" class="list-group"></ul>

            <!-- Clear All -->
            <button
                id="clearAll" class="btn btn-danger w-100 mt-3">Clear All
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
